<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital – DU Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dashboard-page">
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i><span>DU <strong>Portal</strong></span></a>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="courses.html"><i class="fa-solid fa-book-open"></i> My Courses</a>
      <a href="schedule.html"><i class="fa-solid fa-calendar-days"></i> Schedule</a>
      <a href="grades.html"><i class="fa-solid fa-chart-line"></i> Grades</a>
      <a href="hospital.html" class="active"><i class="fa-solid fa-hospital"></i> Hospital</a>
      <a href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <a href="#" class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </aside>

  <main class="dashboard-main">
    <header class="dash-header">
      <div><h1>University Hospital</h1><p>Book appointments and view records.</p></div>
    </header>
    <section class="dash-grid">
      <div class="dash-card">
        <div class="dash-card-header"><h3>Book Appointment</h3></div>
        <form style="display: flex; flex-direction: column; gap: 15px;">
          <input type="text" placeholder="Department (e.g. Dental)" style="padding: 12px; border-radius: 8px; border: 1px solid #ccc;">
          <input type="date" style="padding: 12px; border-radius: 8px; border: 1px solid #ccc;">
          <button type="button" class="btn btn-primary" onclick="alert('Appointment Requested!')">Request Booking</button>
        </form>
      </div>
      <div class="dash-card">
        <div class="dash-card-header"><h3>My Appointments</h3></div>
        <ul class="schedule-list">
          <li><span class="time">Tomorrow</span><div><strong>Dental Clinic</strong><p>Dr. Sarah • 10:00 AM</p></div></li>
          <li><span class="time">Next Week</span><div><strong>General Checkup</strong><p>Dr. Ali • 02:00 PM</p></div></li>
        </ul>
      </div>
    </section>
  </main>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
