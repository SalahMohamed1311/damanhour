<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grades – DU Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dashboard-page">
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i><span>DU <strong>Portal</strong></span></a>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="courses.html"><i class="fa-solid fa-book-open"></i> My Courses</a>
      <a href="schedule.html"><i class="fa-solid fa-calendar-days"></i> Schedule</a>
      <a href="grades.html" class="active"><i class="fa-solid fa-chart-line"></i> Grades</a>
      <a href="hospital.html"><i class="fa-solid fa-hospital"></i> Hospital</a>
      <a href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <a href="#" class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </aside>

  <main class="dashboard-main">
    <header class="dash-header">
      <div><h1>Grades & Transcripts</h1><p>View your academic performance.</p></div>
    </header>
    <section class="dash-stats">
      <div class="dash-stat-card">
        <div class="dash-stat-icon green"><i class="fa-solid fa-chart-line"></i></div>
        <div><h3>3.7</h3><p>Cumulative GPA</p></div>
      </div>
      <div class="dash-stat-card">
        <div class="dash-stat-icon blue"><i class="fa-solid fa-check"></i></div>
        <div><h3>85</h3><p>Passed Hours</p></div>
      </div>
    </section>
    <section class="dash-grid" style="margin-top: 24px;">
      <div class="dash-card wide">
        <div class="dash-card-header"><h3>Last Semester Grades</h3></div>
        <ul class="grades-list">
          <li><span>Software Engineering</span><strong class="grade-a">A</strong></li>
          <li><span>Database Systems</span><strong class="grade-a">A-</strong></li>
          <li><span>Data Structures</span><strong class="grade-b">B+</strong></li>
          <li><span>Operating Systems</span><strong class="grade-b">B</strong></li>
        </ul>
      </div>
    </section>
  </main>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
