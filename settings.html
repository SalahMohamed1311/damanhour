  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dashboard-page">
  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i><span>DU <strong>Portal</strong></span></a>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="courses.html"><i class="fa-solid fa-book-open"></i> My Courses</a>

      <a href="grades.html"><i class="fa-solid fa-chart-line"></i> Grades</a>
      <a href="hospital.html"><i class="fa-solid fa-hospital"></i> Hospital</a>
      <a href="announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
      <a href="settings.html" class="active"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <a href="#" class="logout-btn" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
  </aside>

  <main class="dashboard-main">
    <header class="dash-header">
      <div><h1>Settings</h1><p>Manage your account preferences.</p></div>
    </header>
    <section class="dash-grid">
      <div class="dash-card wide">
        <div class="dash-card-header"><h3>Profile Settings</h3></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" value="Ahmed Mohamed" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc;">
          </div>
          <div class="form-group">
            <label>University Email</label>
            <input type="email" value="ahmed@damanhour.edu.eg" disabled style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; background:#f1f5f9;">
          </div>
        </div>
        <button class="btn btn-primary" style="margin-top: 20px;">Save Changes</button>
      </div>
    </section>
  </main>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
